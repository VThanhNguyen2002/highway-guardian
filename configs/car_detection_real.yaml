# Car Detection Training Configuration
# Dataset: Real Kaggle Car Detection Dataset

model:
  weights: 'yolov8n.pt'  # pretrained model
  architecture: 'yolov8n'

data:
  path: 'C:/PersonalProject/highway-guardian/data/car_detection/car_dataset-master'
  train: 'train/images'
  val: 'valid/images'
  test: 'test/images'
  nc: 1  # number of classes
  names: ['car']  # class names

training:
  epochs: 5
  batch_size: 2
  image_size: 320
  device: 'cpu'
  workers: 0
  optimizer: 'AdamW'
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  box: 7.5
  cls: 0.5
  dfl: 1.5

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

validation:
  save_period: 1
  patience: 10
  conf: 0.001
  iou: 0.6

output:
  project: 'runs/detect'
  name: 'car_detection_real_final'
  plots: true
  verbose: true
  save_txt: false
  save_conf: false