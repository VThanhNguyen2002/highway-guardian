services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: highway-guardian-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - TF_USE_LEGACY_KERAS=1
    restart: unless-stopped
    networks:
      - highway-guardian-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: highway-guardian-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - highway-guardian-network

networks:
  highway-guardian-network:
    driver: bridge
