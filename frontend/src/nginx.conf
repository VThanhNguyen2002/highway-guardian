# frontend/nginx.conf
server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dòng này là quan trọng nhất cho Vue Router:
        # Nếu không tìm thấy file, nó sẽ trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # (Bạn có thể thêm các config khác nếu cần, ví dụ: proxy_pass đến backend)
}